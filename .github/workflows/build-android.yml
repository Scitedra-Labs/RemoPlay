name: Build RemoPlay Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.REMOPLAY_KEYSTORE_BASE64 }}
          REMOPLAY_KEYSTORE_PASSWORD: ${{ secrets.REMOPLAY_KEYSTORE_PASSWORD }}
          REMOPLAY_KEY_ALIAS: remoplay
        run: |
          chmod +x gradlew
          # In-app updates need every build signed with the same key. Without the key in the
          # repository secrets the build still works, it just can't update itself.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/remoplay.keystore"
            export REMOPLAY_KEYSTORE_FILE="$RUNNER_TEMP/remoplay.keystore"
            export REMOPLAY_BUILD_ID="$(git log -1 --format=%ct)"
            echo "REMOPLAY_SELF_UPDATE=1" >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: RemoPlay-Android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find android/app/build/outputs/apk -name '*.apk' | head -1)" RemoPlay-Android.apk
          gh release view latest --repo ${{ github.repository }} || gh release create latest --repo ${{ github.repository }} --title "RemoPlay" --notes "Automatic build of the newest version. Download links are on the project page." --latest || true
          gh release upload latest RemoPlay-Android.apk --repo ${{ github.repository }} --clobber
          # tells installed copies that a newer build exists (in-app update), uploaded after the APK on purpose
          if [ "$REMOPLAY_SELF_UPDATE" = "1" ]; then
            echo "{\"build\": $(git log -1 --format=%ct)}" > version-android.json
            gh release upload latest version-android.json --repo ${{ github.repository }} --clobber
          fi
